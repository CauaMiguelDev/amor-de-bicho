<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#effdf0" />
    <meta name="description" content="Casa Focinho: site demonstrativo de clínica veterinária 24 horas e pet shop. Marca, contatos e depoimentos fictícios." />
    <!-- Demo site: keep it out of search results so the fictional brand is never mistaken for a real clinic. -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>#preloader{position:fixed;inset:0;z-index:300;background:#1a3d1a;color:#effdf0;display:grid;place-content:center;justify-items:center;gap:18px;font:400 30px 'DM Serif Display',serif;letter-spacing:-1px;transition:clip-path .9s cubic-bezier(.76,0,.24,1);clip-path:inset(0 0 0 0);animation:pl-out .9s 5s cubic-bezier(.76,0,.24,1) forwards}#preloader.is-done{clip-path:inset(0 0 100% 0)}#preloader svg{width:70px;height:70px}#preloader path{fill:none;stroke:#effdf0;stroke-width:2.5;stroke-dasharray:1;stroke-dashoffset:1;animation:pl-draw 1s .1s ease-out forwards}#preloader circle{fill:#e86a10;transform-origin:center;transform-box:fill-box;scale:0;animation:pl-pop .5s cubic-bezier(.34,1.56,.64,1) forwards}#preloader circle:nth-of-type(1){animation-delay:.5s}#preloader circle:nth-of-type(2){animation-delay:.6s}#preloader circle:nth-of-type(3){animation-delay:.7s}#preloader span{opacity:0;animation:pl-fade .6s .7s forwards}@keyframes pl-draw{to{stroke-dashoffset:0}}@keyframes pl-pop{to{scale:1}}@keyframes pl-fade{to{opacity:1}}@keyframes pl-out{to{clip-path:inset(0 0 100% 0);visibility:hidden}}@media(prefers-reduced-motion:reduce){#preloader{display:none}}</style>
    <title>Casa Focinho · Clínica Veterinária 24h & Pet Shop (demo)</title>
  </head>
  <body>
    <!-- THESIS: A pet family portrait with care available around the clock. OWN-WORLD: User-pinned CozyPaws reference, mint, forest, orange, editorial serif and sculpted photo panels. STORY: Recognize the care, see (illustrative) community feedback, call or find the clinic. DEMO: fictional brand and data, see src/brand.ts. FIRST VIEWPORT: Centered oversized two-line title, call action, flanking review and 24h notes, three staggered pet portraits. FORM: User-pinned CozyPaws direction; reference overrides random direction selection. FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance -->
    <div id="preloader" aria-hidden="true"><svg viewBox="0 0 64 64"><path pathLength="1" d="M32 50C13 39 11 29 19 24c5-3 10-1 13 3 3-4 8-6 13-3 8 5 6 15-13 26Z"/><circle cx="20" cy="15" r="5"/><circle cx="32" cy="11" r="5"/><circle cx="44" cy="15" r="5"/></svg><span>casa focinho</span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
